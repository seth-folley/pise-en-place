# Copy to evals/<skill-name>/comparisons/<baseline>-to-<candidate>.yaml.
schemaVersion: 1
kind: skill-eval-comparison

name: <skill-name>-<baseline>-to-local-candidate

# Resolved relative to this comparison file.
suite: ../suite.yaml

arms:
  control:
    skill: disabled
  baseline:
    ref: <baseline-ref>
  candidate:
    snapshot:
      # Resolved relative to this comparison and frozen before approval.
      path: <path-to-local-candidate-skill>
    # Committed candidate alternative:
    # ref: <candidate-ref>

change:
  summary: >
    <What this candidate is intended to change.>
  # Optional context; the controller computes the authoritative frozen-tree diff.
  # changelog: <changelog-url-or-path>

hypotheses:
  - id: <hypothesis-id>
    expectedChange: >
      <The specific observable behavior expected to improve.>
    mustNotRegress:
      - <Critical outcome or behavior to preserve.>
    scenarios:
      - <scenario-id-from-suite>

# Record important candidate claims that intentionally have no behavioral eval.
nonGoals: []

execution:
  profile: smoke
  scenarios:
    include:
      - <scenario-id-from-suite>
    # Use this instead of include to select the full suite:
    # all: true

# Choose gated or exploratory explicitly. Exploratory mode has no rules and
# produces an informational verdict when all required cells complete.
acceptance:
  mode: gated
  rules:
    - id: candidate-critical-checks
      type: all-candidate-critical-checks-pass

    - id: no-critical-regressions
      type: no-critical-regressions

    - id: candidate-pass-rate
      type: candidate-pass-rate
      scope: overall
      minimum: 0.85

    - id: baseline-delta-by-scenario
      type: pass-rate-delta
      compareTo: baseline
      scope: eachScenario
      minimum: 0

    - id: skill-lift
      type: pass-rate-delta
      compareTo: control
      scope: overall
      # Confirm this threshold from evidence; do not invent it silently.
      minimum: 0.05

    - id: cost-regression
      type: median-cost-increase
      compareTo: baseline
      scope: eachTarget
      maximum: 0.25

    - id: duration-regression
      type: median-duration-increase
      compareTo: baseline
      scope: eachTarget
      maximum: 0.25

# Exploratory alternative:
# acceptance:
#   mode: exploratory
