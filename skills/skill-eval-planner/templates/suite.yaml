# Copy to evals/<skill-name>/suite.yaml and replace placeholders.
schemaVersion: 1
kind: skill-eval-suite

name: <skill-name>-core

skill:
  name: <skill-name>
  source:
    type: git
    # A local repository path resolves relative to this suite.yaml.
    repository: <git-url-or-local-repository>
  # Resolved inside the repository above. Name the skill directory that contains
  # SKILL.md, not the SKILL.md file itself and not a path relative to suite.yaml.
  path: <skill-directory-within-source>

defaults:
  tools:
    - read
    - bash
    - edit
    - write
  permissions:
    mode: workspace-write
    network: false
  limits:
    # Runner fallbacks are setup 15m, scenario 20m, and check 10m.
    scenarioTimeout: 20m
    setupTimeout: 15m
    checkTimeout: 10m

profiles:
  smoke:
    repetitions: 1
    maxConcurrency: 1
    targets:
      - harness: pi
        model: <provider/model-id>
        thinking: <thinking-level>
    # Optional evaluation-cell budget; active requests may overshoot it.
    # limits:
    #   maxCost: 10.00
    # Optional beginning in milestone 2. A milestone-1 runner must reject,
    # rather than silently ignore, configured supervisor behavior.
    # supervisor:
    #   model: <provider/model-id>
    #   thinking: <thinking-level>

  standard:
    repetitions: 3
    maxConcurrency: 1
    targets:
      - harness: pi
        model: <provider/model-id>
        thinking: <thinking-level>
      - harness: codex
        model: <model-id>
        thinking: <thinking-level>
      - harness: claude-code
        model: <model-id>
        thinking: <thinking-level>
    # Optional beginning in milestone 2.
    # supervisor:
    #   model: <provider/model-id>
    #   thinking: <thinking-level>

scenarios:
  - id: <stable-scenario-id>
    title: <short-title>
    covers:
      - <capability-tag>
    purpose: >
      <The focused behavior this scenario reveals.>

    # Use promptFile instead for long prompts, resolved relative to this suite.
    prompt: |
      <A realistic user request that does not reveal the answer key.>

    fixture:
      type: local
      path: fixtures/<fixture-name>
      # Setup is optional and runs once before the prepared fixture is frozen.
      # Choose exactly one of command or script. Network defaults to false.
      # setup:
      #   command: <setup-command>
      #   network: true

    # Git fixture alternative. A local repository path resolves relative to
    # this suite.yaml, just like skill.source.repository.
    # fixture:
    #   type: git
    #   repository: <git-url-or-local-repository>
    #   ref: <required-commit-ish>
    #   setup:
    #     script: setup/<script-name>
    #     network: false

    # explicit | implicit | contextual | forbidden
    invocation: implicit

    # Always explicit; do not infer this from invocation mode.
    runOn:
      - control
      - baseline
      - candidate

    # Optional scenario overrides. Tool arrays replace suite defaults;
    # permission and limit objects merge field-by-field.
    permissions:
      mode: workspace-write
      network: false

    checks:
      - id: <check-id>
        type: command
        severity: critical
        command: <verification-command>
        expect:
          exitCode: 0

      - id: changes-are-focused
        type: git-diff
        severity: advisory
        expect:
          allowedPaths:
            - <allowed-path-glob>
          forbiddenPatterns:
            - <forbidden-content>

    # Preserved as qualitative evidence; milestone 1 acceptance cannot use it.
    rubric:
      - id: <criterion-id>
        description: <One observable qualitative requirement.>
        weight: 1
